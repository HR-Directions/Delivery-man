<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- تدرج لوني احترافي باللون الأزرق النيلي -->
<linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
</linearGradient>
<!-- تأثير توهج بسيط للعناصر الهامة -->
<filter id="glow">
  <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
  <feMerge>
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>
<!-- خطوط السرعة الخلفية (Speed Trails) -->
<path d="M40 100 H100" stroke="#4338ca" stroke-width="2" stroke-dasharray="10 5" opacity="0.3" />
<path d="M30 130 H80" stroke="#818cf8" stroke-width="3" stroke-dasharray="15 8" opacity="0.5" />
<path d="M45 160 H90" stroke="#4338ca" stroke-width="2" stroke-dasharray="8 4" opacity="0.3" />
<!-- العجلة الخلفية (تصميم مستقبلي مفرغ) -->
<circle cx="85" cy="160" r="28" stroke="url(#mainGrad)" stroke-width="10" />
<circle cx="85" cy="160" r="10" fill="#818cf8" opacity="0.4" />
<!-- العجلة الأمامية (تصميم رياضي مائل) -->
<circle cx="185" cy="160" r="28" stroke="url(#mainGrad)" stroke-width="10" />
<circle cx="185" cy="160" r="10" fill="#818cf8" opacity="0.4" />
<!-- الهيكل الرئيسي الحاد (Sport Body) -->
<path d="M85 132L110 85H160L185 132" stroke="url(#mainGrad)" stroke-width="14" stroke-linejoin="round" />
<!-- مقود الدراجة والرأس (Windshield) -->
<path d="M160 85L175 60L200 65" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
<!-- انسيابية المقعد -->
<path d="M110 85C95 85 80 95 70 105" stroke="url(#mainGrad)" stroke-width="8" stroke-linecap="round" />
<!-- صندوق التوصيل المدمج بالتصميم (Delivery Box) -->
<rect x="75" y="90" width="30" height="25" rx="4" fill="url(#mainGrad)" filter="url(#glow)" />
<path d="M85 90V115" stroke="white" stroke-width="2" stroke-opacity="0.3" />
</svg>
