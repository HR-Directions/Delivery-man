<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A7CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7367F0;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="5" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="50" y="50" width="300" height="300" rx="80" ry="80" 
        fill="url(#bgGradient)" 
        transform="rotate(-5, 200, 200)"
        filter="url(#shadow)" />

  <g fill="white" transform="translate(145, 170) scale(1.2)">
    <path d="M15,40 A15,15 0 1,0 15,40.1 Z M15,47 A8,8 0 1,1 15,47.1 Z" />
    <path d="M65,40 A15,15 0 1,0 65,40.1 Z M65,47 A8,8 0 1,1 65,47.1 Z" />
    <path d="M10,25 Q10,18 25,18 L45,18 L60,35 L55,38 L40,25 L20,25 L15,35 Z" />
    <path d="M45,18 L50,10 L60,10 L60,14 L53,14 L48,22 Z" />
  </g>
</svg>
