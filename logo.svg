<svg id="delivery-logo" width="300" height="300" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Background Circle (Optional aesthetic) -->
            <circle cx="250" cy="250" r="220" fill="#e0f2fe" opacity="0.5"></circle>
            
            <!-- Speed Lines (Speed Impression) -->
            <g id="speed-lines">
                <path d="ID1" stroke="#7dd3fc" stroke-width="12" stroke-linecap="round">
                    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="0.5s" repeatCount="indefinite"></animate>
                </path>
                <path d="M110 240 L20 240" stroke="#38bdf8" stroke-width="15" stroke-linecap="round"></path>
                <path d="M120 280 L50 280" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"></path>
            </g>

            <!-- Motorcycle Body -->
            <g id="motorcycle">
                <!-- Back Wheel -->
                <circle cx="180" cy="350" r="45" stroke="#075985" stroke-width="12" fill="white"></circle>
                <circle cx="180" cy="350" r="15" fill="#075985"></circle>
                
                <!-- Front Wheel -->
                <circle cx="380" cy="350" r="45" stroke="#075985" stroke-width="12" fill="white"></circle>
                <circle cx="380" cy="350" r="15" fill="#075985"></circle>

                <!-- Chassis / Frame -->
                <path d="M180 350 L240 250 L360 250 L380 350" stroke="#0284c7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"></path>
                
                <!-- Seat and Body -->
                <path d="M200 250 Q280 210 350 250" fill="#0ea5e9"></path>
                
                <!-- Delivery Box -->
                <rect x="150" y="180" width="80" height="70" rx="8" fill="#0369a1"></rect>
                <path d="M150 215 H230" stroke="white" stroke-width="4" opacity="0.3"></path>
                
                <!-- Handlebars -->
                <path d="M340 250 L365 200 L390 205" stroke="#075985" stroke-width="10" stroke-linecap="round"></path>
                
                <!-- Wind Shield / Speed Effect on Front -->
                <path d="M370 200 Q410 200 420 230" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" fill="none"></path>
            </g>

            <!-- Text (Optional in Logo) -->
            <text x="250" y="460" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#0369a1" text-anchor="middle">FAST DELIVERY</text>
        </svg>
