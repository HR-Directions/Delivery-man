<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<!-- Definitions for Gradients and Shadows -->
<defs>
<linearGradient id="mainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#00B4DB;stop-opacity:1" />
<stop offset="100%" style="stop-color:#0083B0;stop-opacity:1" />
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<blur stdDeviation="5" />
</filter>
</defs>
   <!-- Background Circle (Soft Light Blue) -->
<circle cx="256" cy="256" r="240" fill="#E1F5FE" opacity="0.5" />

<!-- Speed Lines (Representing Extreme Velocity) -->
<g stroke="#00B4DB" stroke-width="8" stroke-linecap="round">
    <line x1="50" y1="200" x2="150" y2="200" opacity="0.3" />
    <line x1="30" y1="256" x2="130" y2="256" opacity="0.6" />
    <line x1="50" y1="312" x2="150" y2="312" opacity="0.3" />
</g>

<!-- The Super Delivery Symbol (Capsule/Rocket Hybrid) -->
<g transform="translate(140, 160) rotate(15)">
    <!-- Outer Capsule Frame -->
    <rect x="0" y="40" width="240" height="100" rx="50" fill="url(#mainBlue)" />
    
    <!-- Medical Cross (Pharmacy Symbol) -->
    <path d="M120 60 V120 M90 90 H150" stroke="white" stroke-width="20" stroke-linecap="round" />
    
    <!-- Super Cape (Symbolizing the "Super" Power) -->
    <path d="M40 50 Q-60 0 -80 120 Q-20 100 40 90" fill="#0288D1">
        <animateTransform 
            attributeName="transform" 
            type="skewY" 
            values="0;5;0" 
            dur="1s" 
            repeatCount="indefinite" />
    </path>

    <!-- Speed Motion Trails -->
    <path d="M-20 60 H-80 M-30 90 H-110 M-20 120 H-80" stroke="#00B4DB" stroke-width="6" stroke-linecap="round" />
</g>

<!-- Modern Typography (Conceptual Placement) -->
<text x="256" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0083B0" text-anchor="middle">
    PHARMA DASH
</text>
<text x="256" y="480" font-family="Arial, sans-serif" font-size="16" fill="#00B4DB" text-anchor="middle">
    SUPERFAST DELIVERY
</text>         

</svg>
