<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#6977ff" />
      <stop offset="100%" stop-color="#3a51f2" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#1e2985" flood-opacity="0.15"/>
    </filter>
    
    <mask id="donuts">
      <rect width="400" height="400" fill="white" />
      <circle cx="145" cy="225" r="12" fill="black" />
      <circle cx="255" cy="225" r="12" fill="black" />
    </mask>
  </defs>

  <g filter="url(#shadow)">
    <rect x="75" y="75" width="250" height="250" rx="70" fill="url(#bgGrad)" transform="rotate(-15 200 200)" />
  </g>

  <g mask="url(#donuts)" fill="white">
    <circle cx="145" cy="225" r="26" />
    <circle cx="255" cy="225" r="26" />
  </g>

  <g stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <line x1="145" y1="225" x2="182" y2="225" stroke-width="16" />
    
    <line x1="180" y1="225" x2="215" y2="165" stroke-width="28" />
    
    <line x1="255" y1="225" x2="218" y2="148" stroke-width="16" />
    
    <line x1="140" y1="168" x2="205" y2="168" stroke-width="22" />
    
    <line x1="216" y1="148" x2="190" y2="148" stroke-width="12" />
  </g>

  <rect x="210" y="140" width="30" height="18" rx="9" fill="white" />
  
  <polygon points="180,165 210,165 200,195" fill="white" stroke="none" />
</svg>
